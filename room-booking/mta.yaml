_schema-version: "3.1"
ID: room-booking
description: Sistema de Reservación de Salas
version: 1.0.0

parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true

build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production

modules:

# ─── Backend CAP ─────────────────────────────────────────
- name: room-booking-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: room-booking-db
  - name: room-booking-auth
  - name: room-booking-destination-service
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci

# ─── Deploy HANA ─────────────────────────────────────────
- name: room-booking-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: room-booking-db
  parameters:
    buildpack: nodejs_buildpack

# ─── HTML5 App Deployer ───────────────────────────────────
- name: room-booking-app-deployer
  type: com.sap.application.content
  path: gen
  requires:
  - name: room-booking-html5-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: app/
    requires:
    - artifacts:
      - roombookingbookings.zip
      name: roombookingbookings
      target-path: app/

# ─── UI Fiori ────────────────────────────────────────────
- name: roombookingbookings
  type: html5
  path: app/bookings
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []

# ─── Destination Content ─────────────────────────────────
- name: room-booking-destination-content
  type: com.sap.application.content
  requires:
  - name: room-booking-destination-service
    parameters:
      content-target: true
  - name: room-booking-html5-repo-host
    parameters:
      service-key:
        name: room-booking-repo-host-key
  - name: room-booking-auth
    parameters:
      service-key:
        name: room-booking-auth-key
  parameters:
    content:
      instance:
        destinations:
        - Name: room_booking_repo_host
          ServiceInstanceName: room-booking-html5-repo-host
          ServiceKeyName: room-booking-repo-host-key
          sap.cloud.service: room.booking
        - Authentication: OAuth2UserTokenExchange
          Name: room_booking_uaa
          ServiceInstanceName: room-booking-auth
          ServiceKeyName: room-booking-auth-key
          sap.cloud.service: room.booking
        existing_destinations_policy: update
  build-parameters:
    no-source: true

resources:

# ─── HANA HDI Container ──────────────────────────────────
- name: room-booking-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared

# ─── XSUAA ───────────────────────────────────────────────
- name: room-booking-auth
  type: org.cloudfoundry.managed-service
  parameters:
    service: xsuaa
    service-plan: application
    service-name: room-booking-auth
    path: ./xs-security.json

# ─── Destination ─────────────────────────────────────────
- name: room-booking-destination-service
  type: org.cloudfoundry.managed-service
  requires:
  - name: srv-api
  parameters:
    service: destination
    service-plan: lite
    service-name: room-booking-destination-service
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          existing_destinations_policy: update
          destinations:
          - Authentication: NoAuthentication
            HTML5.DynamicDestination: true
            HTML5.ForwardAuthToken: true
            Name: room-booking-srv-api
            ProxyType: Internet
            Type: HTTP
            URL: ~{srv-api/srv-url}
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com

# ─── HTML5 Repo Host ─────────────────────────────────────
- name: room-booking-html5-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: room-booking-html5-repo-host
    service-plan: app-host