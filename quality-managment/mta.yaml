_schema-version: "3.1"
ID: quality-managment
description: SAP CAP Quality Management - Lote Inspector
version: 1.0.0
modules:
- name: quality-managment-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: quality-managment-db
  - name: quality-managment-auth
  - name: quality-managment-destination
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    readiness-health-check-http-endpoint: /health
    readiness-health-check-type: http
  build-parameters:
    builder: npm
- name: quality-managment-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: quality-managment-db
  build-parameters:
    builder: npm
- name: quality-managment-approuter
  type: approuter.nodejs
  path: app/router
  requires:
  - name: srv-api
    group: destinations
    properties:
      forwardAuthToken: true
      name: srv-api
      url: ~{srv-url}
  - name: quality-managment-auth
  - name: quality-managment-html5-repo-runtime
  - name: quality-managment-destination
  provides:
  - name: app-api
    properties:
      app-url: ${default-url}
  parameters:
    disk-quota: 256M
    keep-existing-routes: true
    memory: 256M
- name: quality-managment-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: quality-managment-html5-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - loteinspectorappqminspector.zip
      name: loteinspectorappqminspector
      target-path: resources/
    - artifacts:
      - loteinspectorappqmsupervisor.zip
      name: loteinspectorappqmsupervisor
      target-path: resources/
    - artifacts:
      - loteinspectorappqmdashboard.zip
      name: loteinspectorappqmdashboard
      target-path: resources/
- name: loteinspectorappqminspector
  type: html5
  path: app/qm-inspector
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: loteinspectorappqmsupervisor
  type: html5
  path: app/qm-supervisor
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: loteinspectorappqmdashboard
  type: html5
  path: app/qm-dashboard
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: quality-managment-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
  properties:
    hdi-service-name: ${service-name}
- name: quality-managment-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      tenant-mode: dedicated
      xsappname: quality-managment-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: quality-managment-destination
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: false
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          - Authentication: NoAuthentication
            HTML5.DynamicDestination: true
            HTML5.ForwardAuthToken: true
            Name: srv-api
            ProxyType: Internet
            Type: HTTP
            URL: ~{srv-api/srv-url}
          existing_destinations_policy: update
    service: destination
    service-plan: lite
  requires:
  - name: srv-api
- name: quality-managment-html5-repo-runtime
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-runtime
- name: quality-managment-html5-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-host
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npx cds build --production
